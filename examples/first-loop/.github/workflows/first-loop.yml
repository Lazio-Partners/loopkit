name: first-loop

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: bash examples/first-loop/run-first-loop.sh
        env:
          PI_OFFLINE: "1"
          PI_SKIP_VERSION_CHECK: "1"
