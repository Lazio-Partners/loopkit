# loopkit work registry — example
#
# Validates against patterns/registry.schema.json (run: npm run validate:schemas).
# The `id` is the universal join key: registry.id == verdict.finding_id == round.finding_id.
# Status transitions are driver-only — a worker may never self-promote to approved/done.
schema_version: 1
findings:
  # Finding exercising ONLY the 11 required fields (minimal valid finding).
  - id: LK-0001
    title: Tier-0 contracts spine
    source: manual
    source_ref: W0-0
    status: in_review
    priority: p0
    isolation:
      branch: feat/lk-0001
      worktree: .worktrees/lk-0001
    acceptance: npm run validate:schemas exits 0 and the invalid fixture is rejected
    detector: node tools/validate-schemas.mjs
    created_at: "2026-06-25T16:39:08Z"
    updated_at: "2026-06-25T17:04:33Z"

  # Finding exercising the OPTIONAL extension fields (token_cost, week_one_mode, risk,
  # plus cadence/tools/skills/human_gates and the nullable assigned_turn/verdict_round).
  - id: LK-0007
    title: Daily flaky-test sweep
    source: ci
    source_ref: "https://example.test/ci/run/9981"
    status: open
    priority: p2
    isolation:
      branch: feat/lk-0007
      worktree: .worktrees/lk-0007
    acceptance: the previously-flaky test passes 20 consecutive runs with no retries
    detector: node tools/detect-flaky.mjs --finding LK-0007
    created_at: "2026-06-25T16:50:00Z"
    updated_at: "2026-06-25T16:50:00Z"
    assigned_turn: null
    verdict_round: null
    notes: surfaced by the discovery pass; safe to run in week-one dry-run mode first
    cadence: daily
    risk: low
    tools:
      - read
      - bash
    skills:
      - flaky-triage
    human_gates:
      - pr_review
    week_one_mode: dry_run
    token_cost:
      mode: report
      daily_cap: 50000
      early_exit_required: true
